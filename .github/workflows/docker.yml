name: Build and Push Docker Images

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: go
            context: ./go_app
            image: ghcr.io/bohdanberebel/portfolio-go

          - name: python
            context: ./python_app
            image: ghcr.io/bohdanberebel/portfolio-python

          - name: frontend
            context: ./ts_app
            image: ghcr.io/bohdanberebel/portfolio-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::122773994430:role/portfolio-github-deploy
          aws-region: eu-central-1

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-07930c2d38f91cf0d \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/portfolio && git pull origin main && /opt/portfolio/deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-07930c2d38f91cf0d

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-07930c2d38f91cf0d \
            --query '{Status:Status,StatusDetails:StatusDetails}'
