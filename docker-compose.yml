services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: notes_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notes_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./go_app/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:password@postgres:5432/notes_app?sslmode=disable"
      - "up"

  go_app:
    build:
      context: ./go_app
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notes_app
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: ${JWT_SECRET}
      GIN_MODE: release
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  python_app:
    build:
      context: ./python_app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notes_app
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./ts_app
    ports:
      - "3000:80"
    depends_on:
      - go_app
      - python_app
